<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>스트레스 만땅 — 이 게임을 틀어라</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<style>
  :root { --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1714; touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; font-family: 'Noto Sans KR', sans-serif; color: #fff; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui button, #ui .item { pointer-events: auto; }
  button { font-family: inherit; cursor: pointer; }

  #hud { position: absolute; top: calc(10px + var(--safe-t)); left: 10px; right: 10px; display: flex; gap: 8px; align-items: center; }
  #meter { flex: 1; background: rgba(20,14,10,.62); border-radius: 14px; padding: 7px 12px 9px; backdrop-filter: blur(4px); }
  #meter .lb { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; font-weight: 700; letter-spacing: -.2px; }
  #pct { font-family: 'Black Han Sans'; font-size: 22px; color: #ffcf3f; line-height: 1; }
  #bar { height: 8px; margin-top: 5px; background: rgba(255,255,255,.18); border-radius: 6px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#ffb020,#ff4a1c); transition: width .3s; }
  .hb { width: 40px; height: 40px; border: 0; border-radius: 12px; background: rgba(20,14,10,.62); color: #fff; font-size: 17px; backdrop-filter: blur(4px); }
  .hb.txt { width: auto; padding: 0 11px; font-size: 13px; font-weight: 700; }

  #mode { position: absolute; top: calc(70px + var(--safe-t)); left: 0; right: 0; text-align: center; font-size: 12px; font-weight: 700;
    text-shadow: 0 1px 3px rgba(0,0,0,.8); opacity: .9; }
  #hint { position: absolute; top: 40%; left: 0; right: 0; text-align: center; font-family: 'Black Han Sans'; font-size: 22px;
    text-shadow: 0 2px 8px rgba(0,0,0,.85); transition: opacity .4s; animation: bob 1.4s ease-in-out infinite; }
  #hint small { display: block; font-family: 'Noto Sans KR'; font-size: 13px; font-weight: 700; margin-top: 6px; }
  #hint.off { opacity: 0; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  #tip, #floor { position: absolute; left: 50%; transform: translateX(-50%); padding: 7px 14px; border-radius: 20px; background: rgba(20,14,10,.75);
    font-size: 13px; font-weight: 700; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  #tip { top: calc(96px + var(--safe-t)); }
  #floor { top: 30%; font-family: 'Black Han Sans'; font-size: 20px; color: #ffcf3f; font-weight: 400; }
  #tip.on, #floor.on { opacity: 1; }
  .pop { position: absolute; top: 34%; left: 0; right: 0; text-align: center; font-family: 'Black Han Sans'; font-size: 46px; color: #ffcf3f;
    -webkit-text-stroke: 2px #7a1208; text-shadow: 0 4px 14px rgba(0,0,0,.6); animation: pop 1.6s ease-out forwards; }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 15% { transform: scale(1.15); opacity: 1; } 30% { transform: scale(1); } 100% { transform: translateY(-60px); opacity: 0; } }

  #thrower { position: absolute; left: 50%; bottom: calc(92px + var(--safe-b)); height: 27vh; max-height: 300px; transform: translateX(-50%);
    transform-origin: 50% 100%; filter: drop-shadow(0 6px 10px rgba(0,0,0,.45)); transition: height .1s; }
  #thrower.aim { --ps: .95; filter: drop-shadow(0 6px 10px rgba(0,0,0,.45)) brightness(.92); }
  #thrower.throw { --ps: 1.08; }
  .mv { position: absolute; bottom: calc(150px + var(--safe-b)); width: 52px; height: 64px; border: 0; border-radius: 16px;
    background: rgba(20,14,10,.45); color: #fff; font-size: 24px; }
  #left { left: 8px; } #right { right: 8px; }

  #items { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 6px calc(8px + var(--safe-b)); display: flex; gap: 5px; justify-content: center;
    background: linear-gradient(transparent, rgba(15,10,8,.85) 35%); }
  .item { position: relative; flex: 1; max-width: 78px; aspect-ratio: .86; border: 2px solid rgba(255,255,255,.18); border-radius: 14px;
    background: rgba(255,255,255,.08); padding: 3px 2px 0; color: #fff; display: flex; flex-direction: column; align-items: center; }
  .item img { width: 82%; flex: 1; object-fit: contain; min-height: 0; }
  .item .nm { font-size: 10.5px; font-weight: 700; padding-bottom: 4px; }
  .item .cnt { position: absolute; top: -6px; right: -4px; min-width: 21px; height: 21px; border-radius: 11px; background: #ff4a1c; font-size: 12px;
    font-weight: 900; display: grid; place-items: center; border: 2px solid #1b1714; }
  .item.sel { border-color: #ffcf3f; background: rgba(255,207,63,.22); box-shadow: 0 0 14px rgba(255,190,40,.55); }
  .item.empty { opacity: .3; }

  #title { position: fixed; inset: 0; background: #1b1714 url(assets/title.jpg) center top / contain no-repeat; display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center; padding-bottom: calc(46px + var(--safe-b)); transition: opacity .5s; z-index: 5; }
  #title.gone { opacity: 0; pointer-events: none; }
  #start { font-family: 'Black Han Sans'; font-size: 28px; padding: 14px 54px; border: 3px solid #fff; border-radius: 40px; color: #fff;
    background: linear-gradient(#ff5a24, #c8200c); box-shadow: 0 6px 0 #6e0f04, 0 10px 24px rgba(0,0,0,.5); }
  #start:disabled { filter: grayscale(.7); }
  #start:active { transform: translateY(4px); box-shadow: 0 2px 0 #6e0f04; }
  #title p { margin: 14px 0 0; font-size: 13px; font-weight: 700; text-shadow: 0 1px 4px #000; text-align: center; line-height: 1.6; }

  #result { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,6,4,.6); opacity: 0; pointer-events: none;
    transition: opacity .3s; z-index: 4; }
  #result.on { opacity: 1; pointer-events: auto; }
  #result .card { width: min(86vw, 340px); background: linear-gradient(#3a2a20, #1d1511); border: 2px solid #ffcf3f; border-radius: 22px;
    padding: 24px 20px 20px; text-align: center; }
  #result h2 { margin: 0; font-size: 15px; font-weight: 700; opacity: .85; }
  #rpct { font-family: 'Black Han Sans'; font-size: 72px; color: #ffcf3f; line-height: 1.1; -webkit-text-stroke: 2px #7a1208; }
  #rstar { font-size: 30px; color: #ffcf3f; letter-spacing: 4px; }
  #rmsg { font-family: 'Black Han Sans'; font-size: 22px; margin-top: 8px; word-break: keep-all; }
  #rsub { font-size: 12.5px; opacity: .75; margin: 6px 0 18px; }
  #again { font-family: 'Black Han Sans'; font-size: 22px; padding: 11px 40px; border: 0; border-radius: 30px; color: #fff;
    background: linear-gradient(#ff5a24, #c8200c); box-shadow: 0 5px 0 #6e0f04; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud">
    <div id="meter"><div class="lb"><span>스트레스 해소율</span><span id="pct">0%</span></div><div id="bar"><i></i></div></div>
    <button class="hb" id="mute" title="소리">🔊</button>
    <button class="hb" id="recal" title="기울기 기준 다시 맞추기">🎯</button>
    <button class="hb" id="restart" title="다시 시작">↺</button>
    <button class="hb txt" id="finish">결과</button>
  </div>
  <div id="mode">◀ ▶ 버튼으로 건물 주위를 이동</div>
  <div id="hint">위로 끌어서 조준 → 놓으면 던지기<small>저층을 노리면 위층이 통째로 내려앉아요</small></div>
  <div id="tip"></div>
  <div id="floor"></div>
  <img id="thrower" src="assets/thrower_idle.webp" alt="">
  <button class="mv" id="left">◀</button>
  <button class="mv" id="right">▶</button>
  <div id="items"></div>
</div>
<div id="result"><div class="card">
  <h2>스트레스 해소율</h2>
  <div id="rpct">0%</div>
  <div id="rstar">☆☆☆</div>
  <div id="rmsg"></div>
  <div id="rsub"></div>
  <button id="again">다시 하기</button>
</div></div>
<div id="title">
  <button id="start" disabled>불러오는 중…</button>
  <p>휴대폰을 좌우로 기울이면 이동합니다<br>위로 끌어 조준하고 놓으면 던져요</p>
</div>
<script>
  addEventListener('error', function () { var b = document.getElementById('start'); if (b && b.disabled) b.textContent = '불러오기 실패 · 새로고침'; });
</script>
<script type="module" src="js/game.js"></script>
</body>
</html>
